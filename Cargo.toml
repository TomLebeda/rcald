[package]
name = "rcald"
version = "0.1.0"
edition = "2021"
description = "Lightweight calendar reminder daemon: watches online ics calendars and emits reminders as JSON lines to stdout"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
humantime = "2"
iana-time-zone = "0.1"
ical = "0.11"
log = "0.4"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
