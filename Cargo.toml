[package]
name = "rcald"
version = "0.1.0"
edition = "2024"
description = "Lightweight calendar reminder daemon: watches online ics calendars and emits reminders as JSON lines to stdout"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
reqwest = "0.13.5"
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["macros", "rt", "signal", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
strip = true
lto = true
